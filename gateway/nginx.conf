pid /tmp/nginx.pid;
worker_processes auto;
error_log /dev/stderr warn;
events { worker_connections 1024; }
http {
  access_log /dev/stdout;
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;
  client_max_body_size 64m;
  server {
    listen 8000;
    location / {
      proxy_pass http://ctfd:8000;
      proxy_set_header Host $http_host;
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $scheme;
    }
  }
  server { listen 8081; location / { proxy_pass http://stage1_2_web:80; proxy_set_header Host $http_host; } }
  server { listen 8084; location / { proxy_pass http://stage4_web:80; proxy_set_header Host $http_host; } }
}
stream {
  server { listen 2222; proxy_pass stage6_vault:22; proxy_timeout 1h; }
}
