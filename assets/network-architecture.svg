<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="700" viewBox="0 0 1100 700" role="img" aria-labelledby="title desc">
<title id="title">Operation NightHawk deployed network architecture</title>
<desc id="desc">Local player traffic reaches an Nginx gateway. CTFd, OSINT, web challenge, and vault use separate internal networks; databases remain on separate backend networks.</desc>
<defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto"><path d="M0 0L8 4L0 8Z" fill="#94a3b8"/></marker></defs>
<rect width="1100" height="700" rx="24" fill="#0f172a"/>
<g font-family="Arial, sans-serif" fill="#e2e8f0">
<text x="40" y="48" font-size="26" font-weight="bold">OPERATION NIGHTHAWK</text>
<text x="40" y="78" font-size="15" fill="#94a3b8">Deployed architecture · localhost access · six internal network segments</text>
<rect x="365" y="105" width="370" height="60" rx="12" fill="#1e293b" stroke="#60a5fa"/>
<text x="550" y="132" text-anchor="middle" font-size="17">Player browser / SSH client</text>
<text x="550" y="152" text-anchor="middle" font-size="13" fill="#93c5fd">127.0.0.1 only</text>
<path d="M550 165V200" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="230" y="205" width="640" height="76" rx="12" fill="#1e3a5f" stroke="#38bdf8"/>
<text x="550" y="236" text-anchor="middle" font-size="20" font-weight="bold">Nginx gateway · unprivileged · read-only</text>
<text x="550" y="260" text-anchor="middle" font-size="14">:8000 CTFd   |   :80 OSINT   |   :8080 Web   |   :2222 SSH</text>
<g stroke="#94a3b8" stroke-width="2" fill="none" marker-end="url(#arrow)">
<path d="M330 281V318H155V350"/><path d="M470 281V350"/><path d="M630 281V318H710V350"/><path d="M770 281V318H955V350"/>
</g>
<rect x="35" y="350" width="250" height="95" rx="12" fill="#172f36" stroke="#2dd4bf"/>
<text x="160" y="375" text-anchor="middle" font-size="13" fill="#5eead4">platform_front · internal</text>
<text x="160" y="405" text-anchor="middle" font-size="20" font-weight="bold">CTFd :8000</text>
<text x="160" y="429" text-anchor="middle" font-size="13">UID 1001 · users / flags / scoring</text>
<rect x="325" y="350" width="250" height="95" rx="12" fill="#2d273f" stroke="#a78bfa"/>
<text x="450" y="375" text-anchor="middle" font-size="13" fill="#c4b5fd">osint · internal</text>
<text x="450" y="405" text-anchor="middle" font-size="20" font-weight="bold">Stages 1 + 2 :80</text>
<text x="450" y="429" text-anchor="middle" font-size="13">Static website · EXIF / LSB image</text>
<rect x="615" y="350" width="220" height="95" rx="12" fill="#382d20" stroke="#fbbf24"/>
<text x="725" y="375" text-anchor="middle" font-size="13" fill="#fcd34d">web_front · internal</text>
<text x="725" y="405" text-anchor="middle" font-size="20" font-weight="bold">Stage 4 PHP :80</text>
<text x="725" y="429" text-anchor="middle" font-size="13">Intentional SQL injection</text>
<rect x="865" y="350" width="200" height="95" rx="12" fill="#36232c" stroke="#fb7185"/>
<text x="965" y="375" text-anchor="middle" font-size="13" fill="#fda4af">vault · internal</text>
<text x="965" y="405" text-anchor="middle" font-size="20" font-weight="bold">Stage 6 SSH :22</text>
<text x="965" y="429" text-anchor="middle" font-size="13">Ubuntu · container root objective</text>
<path d="M160 445V478" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<path d="M725 445V478" stroke="#94a3b8" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="35" y="483" width="250" height="85" rx="12" fill="#172f36" stroke="#2dd4bf" stroke-dasharray="6 4"/>
<text x="160" y="511" text-anchor="middle" font-size="13" fill="#5eead4">platform · internal backend</text>
<text x="160" y="539" text-anchor="middle" font-size="17">MariaDB :3306 + Redis :6379</text>
<rect x="615" y="483" width="220" height="85" rx="12" fill="#382d20" stroke="#fbbf24" stroke-dasharray="6 4"/>
<text x="725" y="511" text-anchor="middle" font-size="13" fill="#fcd34d">web_challenge · internal backend</text>
<text x="725" y="539" text-anchor="middle" font-size="17">Stage 4 MariaDB :3306</text>
<rect x="325" y="483" width="250" height="85" rx="12" fill="#1e293b" stroke="#64748b"/>
<text x="450" y="511" text-anchor="middle" font-size="16">CTFd downloadable evidence</text>
<text x="450" y="538" text-anchor="middle" font-size="13">Stages 2 / 3 / 5 · no extra services</text>
<text x="40" y="616" font-size="14">Only the gateway joins the edge bridge. Challenge containers have no external network attachment.</text>
<text x="40" y="642" font-size="14">Databases have no published ports. No privileged containers, host system directory mounts, or Docker socket mounts.</text>
<text x="40" y="668" font-size="13" fill="#94a3b8">Docker containers share the host kernel; the vault replaces the dedicated VM described in the initial proposal.</text>
</g></svg>
